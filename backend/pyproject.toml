[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line too long — we use 100 but don't want to fail on it
    "B008",   # function call in default argument (FastAPI Depends)
    "UP007",  # use X | Y — py3.12 supports it but we keep Optional for compat
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"tests/*" = ["B011"]